services:
  postgres:
    image: postgres:16
    container_name: estoque-postgres
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
    ports:
      - "5432:5432"
    volumes:
      - estoque-dados:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: estoque-redis
    ports:
      - "6379:6379"

  api1:
    build: .
    container_name: estoque-api1
    environment: &api-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/estoque
      SPRING_DATA_REDIS_HOST: redis
    depends_on: [postgres, redis]
    restart: on-failure

  api2:
    build: .
    container_name: estoque-api2
    environment: *api-env
    depends_on: [postgres, redis]
    restart: on-failure

  nginx:
    image: nginx:1.27
    container_name: estoque-nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api1, api2]

volumes:
  estoque-dados: